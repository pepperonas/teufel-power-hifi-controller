<style>
        /* Diese App trug noch das ältere Blaugrau-Schema (#2B2E3B/#688db1) und
           lag damit weiter von der Referenz entfernt als die übrigen. Die
           Verkettung an shared/theme.css holt sie in einem Zug auf Linie. */
        :root {
            --background-dark: var(--sh-bg);
            --background-darker: var(--sh-bg2);
            --card-background: var(--sh-surface);
            --accent-blue: var(--sh-primary);
            --accent-green: var(--sh-ok);
            --accent-red: var(--sh-loud);
            --accent-orange: #e4a853;
            --text-primary: var(--sh-text);
            --text-secondary: var(--sh-text2);

            /* Stillgelegt: Höhe entsteht über Kontur und Flächenton. */
            --shadow-sm: none;
            --shadow: none;
            --shadow-lg: none;

            /* Abstände */
            --spacing-1: 0.25rem;
            --spacing-2: 0.5rem;
            --spacing-3: 0.75rem;
            --spacing-4: 1rem;
            --spacing-6: 1.5rem;
            --spacing-8: 2rem;
            --spacing-12: 3rem;
            --spacing-16: 4rem;

            /* Rundungen */
            --radius-sm: var(--sh-radius-sm);
            --radius: var(--sh-radius);
            --radius-lg: var(--sh-radius);
            --radius-xl: var(--sh-radius);

            /* Typografie */
            --font-family: var(--sh-font);
        }

        /* Light Theme */
        /* Der eigene Hell-Block ist entfallen: shared/theme.css kippt die
           --sh-*-Tokens unter [data-theme="light"], und da die Tokens dieser
           App darauf zeigen, kippt sie automatisch mit. */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Grund, Schrift, Polster und Zeilenhöhe kommen aus shared/theme.css. */
        body {
            color: var(--text-primary);
        }

        .head-row{ display:flex; align-items:flex-start; justify-content:space-between;
                    gap:1rem; flex-wrap:wrap; }
        .header .sub{ color: var(--sh-text2); font-size:.9rem; margin-top:.35rem; }

        /* Kopf ohne Platte, auf der Inhaltsspalte. Klassenebene, weil
           `.header` ein blankes `header` schlägt. */
        .header {
            background-color: transparent;
            /* Kein zweites Oberpolster: die 20 px zum Leistenrand kommen bereits
               vom body — so macht es der Massstab. Beides zusammen ergab 40. */
            padding: 0 0 var(--sh-gap-lg);
            box-shadow: none;
            position: static;
            max-width: var(--sh-measure);
            margin: 0 auto;
        }

        .header h1 {
            text-align: left;
            font-size: clamp(1.85rem, 5vw, 2.55rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            text-align: left;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        /* 1200 px OHNE eigenes Polster — sonst bleiben 1152 px Inhalt. */
        .container {
            max-width: var(--sh-measure);
            margin: 0 auto;
            padding: 0 0 var(--sh-pad-bottom);
        }

        .card {
            background-color: var(--card-background);
            border-radius: var(--radius-xl);
            padding: var(--sh-card-pad);
            margin-bottom: var(--sh-gap-lg);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }


        /* Kartentitel wie in der Referenz: klein, fest, in Textfarbe,
           linksbuendig. Gross-zentriert-akzentblau liess jede Karte wie eine
           eigene Seite mit eigener Ueberschrift wirken. */
        .card h2 {
            font-size: 1.05rem;
            font-weight: 750;
            letter-spacing: -.01em;
            margin-bottom: var(--sh-gap);
            color: var(--sh-text);
            text-align: left;
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: var(--spacing-3);
            color: var(--text-primary);
        }

        .grid {
            display: grid;
            gap: var(--spacing-6);
        }

        .grid-2 {
            grid-template-columns: 1fr 1fr;
        }

        .grid-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .grid-4 {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        .grid-symmetric {
            display: grid;
            place-items: center;
            justify-content: center;
            align-items: center;
        }

        /* Buttons */
        .btn {
            /* Neutrale Pille als Grundzustand — wie in der Referenz und wie
               inzwischen in hue und yamaha. */
            background: color-mix(in srgb, var(--sh-text) 4%, transparent);
            color: var(--sh-text2);
            padding: var(--spacing-2) var(--spacing-4);   /* kompakt (2026-08-14) */
            border: 1px solid var(--sh-outline);
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-2);
            /* 2026-08-14: row statt column — die Icon-ueber-Text-Stapelung
               machte JEDEN Button doppelt so hoch wie noetig */
            flex-direction: row;
            text-align: center;
            min-height: 44px;   /* Touch-Target trotz kompakter Optik */
            width: 100%;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: #5a7a9a;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background-color: var(--accent-green);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #8aa47d;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-danger {
            background-color: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            background-color: #d04f50;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-warning {
            background-color: var(--accent-orange);
            color: white;
        }

        .btn-warning:hover {
            background-color: #d89441;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
        }

        .btn-outline:hover {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-outline.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-sm {
            padding: var(--spacing-2) var(--spacing-4);
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: var(--spacing-4) var(--spacing-8);
            font-size: 1.125rem;
        }

        /* Kompakt-Layout 2026-08-14 */
        .ctl-row { display: flex; gap: var(--spacing-3); align-items: center; flex-wrap: wrap; }
        .ctl-row .btn { flex: 1 1 120px; }
        .big-sign { font-size: 1.35rem; line-height: 1; font-weight: 600; }
        .eq-rows { display: grid; gap: var(--spacing-2); }
        .eq-row { display: grid; grid-template-columns: 1fr auto auto; gap: var(--spacing-2); align-items: center; }
        .eq-row .btn { min-width: 72px; }
        .eq-label { display: flex; align-items: center; gap: var(--spacing-2); font-weight: 600; }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: var(--spacing-2); }
        .usb-i { width: 1em; height: 1em; display: block; }
        .bn-group h3 { display: flex; align-items: center; gap: var(--spacing-2); justify-content: center; margin-bottom: var(--spacing-2); }
        .bn-btns { display: flex; gap: var(--spacing-2); justify-content: center; }
        .bn-btns .btn { min-width: 84px; }
        .btn:focus-visible, .power-button:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        /* Slider */
        .slider-container {
            margin-bottom: var(--spacing-4);
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-2);
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: var(--radius);
            background: var(--background-darker);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #5a7a9a;
            transform: scale(1.1);
            box-shadow: var(--shadow);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-sm);
        }

        /* Status-Anzeigen */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-2);
            padding: var(--spacing-2) var(--spacing-4);
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-connected {
            background-color: rgba(156, 182, 143, 0.2);
            color: var(--accent-green);
        }

        .status-disconnected {
            background-color: rgba(225, 97, 98, 0.2);
            color: var(--accent-red);
        }

        .status-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* Power Button */
        .power-button {
            width: 72px;
            height: 72px;
            flex: 0 0 auto;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: var(--background-darker);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin: 0;
            position: relative;
            box-shadow: var(--shadow);
        }

        .power-button:hover {
            border-color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        .power-button.on {
            border-color: var(--accent-green);
            background: rgba(156, 182, 143, 0.2);
            box-shadow: 0 0 20px rgba(156, 182, 143, 0.5);
        }

        .power-button svg {
            width: 60px;
            height: 60px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2.5;
            transition: fill 0.3s ease;
        }

        .power-button.on svg {
            stroke: var(--accent-green);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-6);
        }

        .stat-card {
            background: var(--background-darker);
            padding: var(--spacing-4);
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: var(--spacing-1);
        }

        /* Message */
        .message {
            position: fixed;
            bottom: var(--spacing-6);
            right: var(--spacing-6);
            padding: var(--spacing-4) var(--spacing-6);
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
            max-width: 400px;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .message.success {
            background-color: var(--accent-green);
        }

        .message.error {
            background-color: var(--accent-red);
        }

        .message.info {
            background-color: var(--accent-blue);
        }

        .message.warning {
            background-color: var(--accent-orange);
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            margin-top: var(--spacing-3);
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 32px;
            background: var(--background-darker);
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }


        .toggle-switch.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .toggle-switch.active::after {
            transform: translateX(28px);
        }

        .toggle-label {
            color: var(--text-primary);
            font-size: 0.95rem;
            user-select: none;
            cursor: pointer;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-4);
            }

            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }

            /* Volume controls mobile layout */
            
            /* Reorder volume buttons for mobile: up, down, mute */
            .volume-controls #vol-up {
                order: 1;
            }
            
            .volume-controls #vol-down {
                order: 2;
            }
            
            .volume-controls #mute-toggle {
                order: 3;
            }
        }

        /* =====================================================================
           Material Design 3 Expressive — Reskin (2026-06-16)
           Additiver Override: Tokens/Shapes/Type/Motion. Markup & JS unberührt.
           Konsistent mit den übrigen Smart-Home-UIs (md3-expressive.css).
           ===================================================================== */
        :root {
            --md-primary: var(--sh-primary);
            --md-on-primary: var(--sh-on-primary);
            --md-outline-variant: var(--sh-outline);

            /* ⚠️ Zweiter, SPÄTERER Token-Block aus dem MD3-Sweep 2026-06-16 — er
               gewinnt gegen den ersten oben. Wer nur den ersten verkettet, sieht
               keine Wirkung und sucht am falschen Ort. Auch dieser zeigt jetzt
               auf shared/theme.css. */
            --background-dark: var(--sh-bg);
            --background-darker: var(--sh-bg2);
            --card-background: var(--sh-surface);
            --accent-blue: var(--sh-primary);
            --accent-green: var(--sh-ok);
            --accent-red: var(--sh-loud);
            --accent-orange: var(--sh-warn);
            --text-primary: var(--sh-text);
            --text-secondary: var(--sh-text2);
            /* On-Farben für gefüllte Akzent-Buttons (dunkler Text auf hellem Ton) */
            --on-blue: var(--sh-on-primary);
            --on-green: var(--sh-on-ok);
            --on-red: var(--sh-on-loud);
            --on-orange: var(--sh-on-warn);

            /* Verkettet, nicht fest verdrahtet. Dieser zweite :root-Block steht
               NACH dem ersten und gewinnt — die Radien hier fest zu lassen hiess,
               dass die Angleichung weiter oben sichtbar nichts bewirkt. */
            --radius-sm: var(--sh-radius-sm);
            --radius:    var(--sh-radius);
            --radius-lg: var(--sh-pill);
            --radius-xl: var(--sh-radius);

            /* Expressive Spring (spatial = Overshoot) + Effects-Easing */
            --md-ease-spatial: linear(0,0.009 1.2%,0.035 2.5%,0.158 6%,0.793 18.4%,0.984 23%,1.07 27%,1.104 31.5%,1.103 35%,1.07 41%,1.013 50%,0.991 57%,0.998 75%,1);
            --md-ease-effects: cubic-bezier(0.2,0,0,1);

            --font-family: "Roboto Flex","Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
        }

        /* Kein app-eigener Hell-Block mehr: alle Tokens oben zeigen auf --sh-*,
           und die kippt shared/theme.css unter [data-theme="light"] selbst. Eine
           zweite Palette hier hiesse, dieselbe Absicht an zwei Orten zu pflegen
           — genau so sind die neun Themes auseinandergelaufen. */

        /* ---- Surfaces ---- */
        /* Diese spätere Regel hielt die Platte am Leben: eigener Flächenton,
           abgerundete Unterkante und ein hart verdrahteter Schatten, der an den
           Token-Änderungen oben vorbeilief. */
        .header {
            background: transparent;
            border-radius: 0;
            box-shadow: none;

                // Volume control
                this.elements.volUpBtn.addEventListener('click', () => this.handleVolumeUp());
                this.elements.volDownBtn.addEventListener('click', () => this.sendCommand('volume', { action: 'down' }));
                this.elements.muteToggle.addEventListener('click', () => this.sendCommand('mute'));

                // Input selection
                this.elements.inputBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const input = e.currentTarget.dataset.input;
                        this.sendCommand('input', { input });
                    });
                });

                // EQ controls
                this.elements.eqBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const eq = e.currentTarget.dataset.eq;
                        const action = e.currentTarget.dataset.action;
                        this.sendCommand('eq', { type: eq, action });
                    });
                });

                // Balance controls
                this.elements.balanceBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const direction = e.currentTarget.dataset.balance;
                        this.sendCommand('balance', { direction });
                    });
                });

                // Navigation controls
                this.elements.navBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const direction = e.currentTarget.dataset.nav;
                        this.sendCommand('navigation', { direction });
                    });
                });

                // Theme toggle
            }

            handleVolumeUp() {
                // Check if cooldown is active
                if (this.cooldownActive) {
                    const remainingTime = Math.ceil((this.cooldownEndTime - Date.now()) / 1000);
                    this.showMessage(`Cooldown aktiv! Noch ${remainingTime}s warten...`, 'info');
                    return;
                }

                // Add current timestamp to volume steps
                const now = Date.now();
                this.volumeSteps.push(now);

                // Remove steps older than time window
                this.volumeSteps = this.volumeSteps.filter(time => now - time < this.timeWindow);

                // Check if rate limit exceeded
                if (this.volumeSteps.length > this.maxStepsPerWindow) {
                    this.startCooldown();
                    return;
                }

                // Send the volume up command
                this.sendCommand('volume', { action: 'up' });
            }

            startCooldown() {
                this.cooldownActive = true;
                this.cooldownEndTime = Date.now() + this.cooldownDuration;
                this.volumeSteps = []; // Clear volume steps

                // Disable volume up button visually
                this.elements.volUpBtn.disabled = true;
                this.elements.volUpBtn.style.opacity = '0.5';

                // Show funny warning message
                this.showMessage('Cooldown aktiviert! Wir wollen es nicht übertreiben!', 'warning');

                // Start countdown timer
                this.updateCooldownTimer();

                // Re-enable after cooldown
                setTimeout(() => {
                    this.cooldownActive = false;
                    this.cooldownEndTime = null;
                    this.elements.volUpBtn.disabled = false;
                    this.elements.volUpBtn.style.opacity = '1';
                    this.elements.volUpBtn.innerHTML = '<span style="font-size: 2rem;">+</span><span>Lauter</span>';
                    this.showMessage('Lautstärke wieder verfügbar!', 'success');
                }, this.cooldownDuration);
            }

            updateCooldownTimer() {
                if (!this.cooldownActive) return;

                const remainingTime = Math.ceil((this.cooldownEndTime - Date.now()) / 1000);
                if (remainingTime > 0) {
                    // Update button text with countdown
                    this.elements.volUpBtn.innerHTML = `<span class="sh-i">${shSvg('clock')}</span><span>Warten... ${remainingTime}s</span>`;
                    
                    setTimeout(() => this.updateCooldownTimer(), 1000);
                }
                // Button text will be restored by the main cooldown timeout
            }

            async sendCommand(endpoint, data = {}) {
                try {
                    const response = await fetch(`api/${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();

                    if (result.success) {
                        this.applyState(endpoint, result);
                        this.flashButton('md-confirm');
                        this.showSuccessMessage(endpoint, data);
                    } else {
                        this.flashButton('md-shake');
                        this.showMessage('Befehl fehlgeschlagen', 'error');
                    }
                } catch (error) {
                    this.flashButton('md-shake');
                    this.showMessage('Verbindungsfehler', 'error');
                }
            }

            // Map the live device state (returned by the API) onto MD3 visual state.
            applyState(endpoint, result) {
                try {
                    if (typeof result.powered === 'boolean') {
                        this.elements.powerBtn.classList.toggle('on', result.powered);
                    }
                    if (result.currentInput) {
                        this.elements.inputBtns.forEach(b =>
                            b.classList.toggle('active', b.dataset.input === result.currentInput));
                    }
                    if (typeof result.muted === 'boolean') {
                        const m = this.elements.muteToggle;
                        m.classList.toggle('is-muted', result.muted);
                        // Icon + Label spiegeln den Zustand: Ton an vs. Gemutet
                        m.innerHTML = result.muted
                            ? '<span class="sh-i">' + shSvg('mute') + '</span><span>Gemutet</span>'
                            : '<span class="sh-i">' + shSvg('speaker') + '</span><span>Ton an</span>';
                    }
                } catch (_) {}
            }

            // Brief MD3 micro-interaction on the button that triggered the command.
            flashButton(cls) {
                const el = window.__lastBtn;
                if (!el) return;
                el.classList.remove(cls);
                void el.offsetWidth;        // reflow so the animation can replay
                el.classList.add(cls);
                setTimeout(() => el.classList.remove(cls), 650);
            }

            showSuccessMessage(endpoint, data) {
                let message = 'Befehl gesendet';
                
                switch (endpoint) {
                    case 'power':
                        message = 'Power-Signal gesendet';
                        break;
                    case 'volume':
                        message = data.action === 'up' ? 'Lautstärke +' : 'Lautstärke −';
                        break;
                    case 'mute':
                        message = 'Stumm-Signal gesendet';
                        break;
                    case 'input':
                        message = `${data.input} ausgewählt`;
                        break;
                    case 'eq':
                        const eqName = data.type === 'bass' ? 'Bass' : data.type === 'mid' ? 'Mitten' : 'Höhen';
                        message = `️ ${eqName} ${data.action === 'up' ? '+' : '−'}`;
                        break;
                    case 'balance':
                        message = `Balance ${data.direction === 'left' ? '←' : '→'}`;
                        break;
                    case 'navigation':
                        message = `Navigation ${data.direction === 'left' ? '←' : '→'}`;
                        break;
                }
                
                this.showMessage(message, 'success');
            }

            showMessage(text, type = 'info') {
                this.elements.message.textContent = text;
                this.elements.message.className = `message ${type} show`;

                setTimeout(() => {
                    this.elements.message.classList.remove('show');
                }, 3000);
            }

            initializeTheme() {
                // Umschalten, Speichern und der Kreis-Reveal liegen in
                // shared/nav.js — eine Implementierung fuer alle Apps. Hier
                // bleibt nur, was nur diese Seite weiss: die Farbe der
                // Browser-Leiste. <meta> loest kein var() auf, also ein Literal.
                const sync = t => {
                    const m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', t === 'light' ? '#f8fafc' : '#2B2E3B');
                };
                window.addEventListener('sh-theme', e => sync(e.detail.theme));
                sync(document.documentElement.getAttribute('data-theme'));
            }
        }

        // Initialize the application
        const controller = new TeufelController();
    </script>
<script>/* cursor-sheen (gated, rAF-throttled, additiv) */
(function(){try{
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var sel='.card',el=null,x=0,y=0,q=false;
  function f(){q=false;if(!el)return;var r=el.getBoundingClientRect();
    el.style.setProperty('--mx',((x-r.left)/r.width*100)+'%');
    el.style.setProperty('--my',((y-r.top)/r.height*100)+'%');}
  document.addEventListener('pointermove',function(e){
    var c=e.target.closest?e.target.closest(sel):null;el=c;x=e.clientX;y=e.clientY;
    if(c&&!q){q=true;requestAnimationFrame(f);}
  },{passive:true});
}catch(_){}})();</script>
<script>/* MD3 Expressive: taktile Ripples + Value-Pop (additiv, reduced-motion-aware) */
(function(){try{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // Ripple on press for buttons / interactive controls
  var RSEL='.btn, .power-button, .toggle-switch, [role="button"]';
  function nudgeDir(el){
    if(el.id==='vol-up') return 'up';
    if(el.id==='vol-down') return 'down';
    var ds=el.dataset||{};
    if(ds.action==='up') return 'up';
    if(ds.action==='down') return 'down';
    if(ds.balance==='left'||ds.nav==='left') return 'left';
    if(ds.balance==='right'||ds.nav==='right') return 'right';
    return null;
  }
  document.addEventListener('pointerdown', function(e){
    var t = e.target.closest ? e.target.closest(RSEL) : null;
    if(!t || t.disabled) return;
    // remember the command button for the success/error micro-interaction
    if(t.matches && t.matches('.btn, .power-button')){ window.__lastBtn = t; }
    // directional nudge implying +/- / arrow direction
    var ndir = nudgeDir(t);
    if(ndir){ t.classList.remove('nudge-'+ndir); void t.offsetWidth; t.classList.add('nudge-'+ndir);
      setTimeout(function(){ t.classList.remove('nudge-'+ndir); }, 420); }
    if(getComputedStyle(t).position === 'static'){ t.style.position='relative'; }
    t.classList.add('md-ripple-host');
    var r = t.getBoundingClientRect();
    var d = Math.max(r.width, r.height) * 1.05;
    var s = document.createElement('span');
    s.className='md-ripple';
    s.style.width = s.style.height = d+'px';
    s.style.left = (e.clientX - r.left - d/2)+'px';
    s.style.top  = (e.clientY - r.top  - d/2)+'px';
    t.appendChild(s);
    s.addEventListener('animationend', function(){ s.remove(); });
  }, {passive:true});
  // Value pop: spring-scale whenever a number/label is swapped in
  var VSEL='.stat-value, .volume-value, [data-pop]';
  function pop(el){ el.classList.remove('md-pop'); void el.offsetWidth; el.classList.add('md-pop'); }
  document.querySelectorAll(VSEL).forEach(function(el){
    try{ new MutationObserver(function(){ pop(el); }).observe(el, {childList:true, characterData:true, subtree:true}); }catch(_){}
  });
}catch(_){}})();</script>
